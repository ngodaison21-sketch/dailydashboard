<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo công việc</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e3e6ec;--pri:#2f6fdb;--A:#1f9d55;--B:#2f6fdb;--C:#d99a00;--D:#d64545;--in:#fff}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mu:#97a0b2;--bd:#2f3642;--pri:#4b86ea;--in:#262c37}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:1000px;margin:auto;padding:16px}
input,select,button,textarea{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx)}
button{cursor:pointer}.pri{background:var(--pri);color:#fff;border:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
details.c{margin-bottom:12px}summary{cursor:pointer;color:var(--mu)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--in)}
:root[data-theme="dark"] input[type=date]{color-scheme:dark}.seg button.on{background:var(--pri);color:#fff}
#card{background:var(--card);padding:22px;border-radius:14px;border:1px solid var(--bd)}
#card h2{margin:0;font-size:20px}#card .sub{color:var(--mu);margin-bottom:14px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.k div{border:1px solid var(--bd);border-radius:10px;padding:10px}
.k div div{border:0;padding:0;border-radius:0}.k b{display:block;font-size:24px}.k span{color:var(--mu);font-size:12px}
.g{display:inline-block;min-width:26px;text-align:center;border-radius:6px;color:#fff!important;font-size:14px;line-height:22px;vertical-align:middle;font-weight:700;padding:0 6px}
.gA{background:var(--A)}.gB{background:var(--B)}.gC{background:var(--C)}.gD{background:var(--D)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;margin-bottom:16px;border-bottom:1px solid var(--bd)}
.col{flex:1;max-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu)}
.col i{width:70%;border-radius:4px 4px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:12px}.tbl{overflow-x:auto}.mu{color:var(--mu)}
.foot{color:var(--mu);font-size:11px;margin-top:10px}
</style></head><body><div class="w">

<details class="c" id="cfg"><summary>Cấu hình và dán báo cáo</summary>
  <div class="bar" style="margin-top:10px"><input id="api" placeholder="URL Web App Apps Script" style="flex:1;min-width:220px">
  <input id="tok" type="password" placeholder="Token" style="width:140px">
  <input id="tokcn" type="password" placeholder="Token cá nhân (tùy chọn)" style="width:190px"><button class="pri" id="go">Tải dữ liệu</button></div>
  <textarea id="paste" rows="4" style="width:100%;font:12px monospace" placeholder='Dán khối {"items":[...]} từ Claude vào đây'></textarea>
  <div class="bar" style="margin-top:6px"><button class="pri" id="send">Gửi lên Sheet</button><span class="mu" id="sst"></span></div>
</details>

<div class="bar"><div class="seg" id="tab"><button data-t="ld" class="on">Báo cáo lãnh đạo</button><button data-t="cn">🔒 Phát triển cá nhân</button></div></div>
<div class="bar">
  <div class="seg" id="seg"><button data-k="ngay" class="on">Ngày</button><button data-k="tuan">Tuần</button><button data-k="thang">Tháng</button></div>
  <button id="prev">‹</button><input id="d" type="date"><button id="next">›</button>
  <button id="today">Hôm nay</button>
  <button id="theme" style="margin-left:auto" title="Đổi giao diện sáng/tối">🌙 Tối</button>
  <button class="pri" id="png">Xuất ảnh PNG</button>
</div>

<div id="card"></div>
<p class="mu" id="st"></p>
</div>
<script>
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=h=>`<span class="g g${h}">${h}</span>`;
const hang=d=>d>=85?'A':d>=70?'B':d>=50?'C':'D';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const vn=s=>{const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const THU=['CN','T2','T3','T4','T5','T6','T7'];
let ITEMS=[],KY='ngay',TAB='ld';
const laRT=i=>i.rieng_tu===true||String(i.rieng_tu).toLowerCase()==='true';
$('api').value=ls.get('api');$('tok').value=ls.get('tok');$('tokcn').value=ls.get('tokcn');$('d').value=iso(new Date());
if(!$('api').value)$('cfg').open=true;

// Cùng mô hình với Code.gs: 60% chất lượng + 40% khối lượng (50% giờ, 50% đơn vị việc theo độ khó)
const DM={gio_ngay:8,don_vi_ngay:3,cl:0.6};
function chamKy(list,n){
  n=Math.max(1,n||1);
  if(!list.length)return{diem:0,cl:0,kl:0,gio:0,dv:0};
  let t=0,w=0,ph=0,dv=0;
  list.forEach(i=>{const ts=+i.thoi_gian_phut>0?+i.thoi_gian_phut:30;t+=(+i.diem)*ts;w+=ts;ph+=+i.thoi_gian_phut||0;
    const k=Math.min(5,Math.max(1,+i.do_kho||3))/3;dv+=i.trang_thai==='hoan_thanh'?k:i.trang_thai==='dang_lam'?k/2:0});
  const cl=t/w,kl=100*(0.5*Math.min(1,ph/60/(DM.gio_ngay*n))+0.5*Math.min(1,dv/(DM.don_vi_ngay*n)));
  return{diem:Math.round(DM.cl*cl+(1-DM.cl)*kl),cl:Math.round(cl),kl:Math.round(kl),gio:ph/60,dv:Math.round(dv*10)/10};
}
// số ngày làm việc trong kỳ: T2 đến T7 tính đến hôm nay, cộng Chủ nhật có làm việc
function soNgayLV(s,e,list){
  const today=iso(new Date());let n=0;
  for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){const k=iso(d);
    if(k>today)break; if(d.getDay()!==0||list.some(i=>i.ngay===k))n++;}
  return Math.max(1,n);
}
function khoang(){
  const d=parse($('d').value);
  if(KY==='ngay')return[d,d];
  if(KY==='tuan'){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}
  return[new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,0)];
}
function tieuDe(s,e){
  if(KY==='ngay')return`Ngày ${vn(iso(s))} (${THU[s.getDay()]})`;
  if(KY==='tuan')return`Tuần ${vn(iso(s))} đến ${vn(iso(e))}`;
  return`Tháng ${pad(s.getMonth()+1)}/${s.getFullYear()}`;
}
async function load(){
  ls.set('api',$('api').value.trim());ls.set('tok',$('tok').value);ls.set('tokcn',$('tokcn').value);
  if(!$('api').value){$('st').textContent='Mở "Cấu hình" để nhập URL Web App và Token.';return render()}
  $('st').textContent='Đang tải...';
  try{const r=await (await fetch($('api').value.trim()+'?'+new URLSearchParams({token:$('tok').value,token_cn:$('tokcn').value}))).json();
    if(!r.ok)throw new Error(r.error);
    ITEMS=r.items.map(i=>({...i,ngay:String(i.ngay).slice(0,10)}));
    $('st').textContent='Dữ liệu cập nhật lúc '+new Date().toLocaleString('vi-VN');$('cfg').open=false;
  }catch(e){$('st').textContent='Lỗi: '+e.message}
  render();
}
function render(){
  $('png').style.display=TAB==='cn'?'none':'';
  if(TAB==='cn')return renderCN();
  const[s,e]=khoang(),a=iso(s),b=iso(e);
  const list=ITEMS.filter(i=>i.ngay>=a&&i.ngay<=b&&!laRT(i)).sort((x,y)=>x.ngay.localeCompare(y.ngay));
  const nLV=KY==='ngay'?1:soNgayLV(s,e,list),K=chamKy(list,nLV),diem=K.diem,h=list.length?hang(diem):'-';
  const phut=list.reduce((t,i)=>t+(+i.thoi_gian_phut||0),0);
  const dem={A:0,B:0,C:0,D:0};list.forEach(i=>dem[i.hang]=(dem[i.hang]||0)+1);
  const xong=list.filter(i=>i.trang_thai==='hoan_thanh').length;
  // biểu đồ: ngày = từng việc; tuần/tháng = từng ngày
  let cols=[];
  if(KY==='ngay')cols=list.map((i,n)=>({lb:'#'+(n+1),v:+i.diem,h:i.hang,t:i.viec}));
  else for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){
    const k=iso(d),l=list.filter(i=>i.ngay===k),v=chamKy(l,1).diem;
    cols.push({lb:KY==='tuan'?THU[d.getDay()]:d.getDate(),v,h:l.length?hang(v):'',t:`${vn(k)}: ${l.length} việc`});
  }
  $('card').innerHTML=`
  <h2>Báo cáo công việc | ${tieuDe(s,e)}</h2><div class="sub">Người báo cáo: Ngô Đại Sơn</div>
  <div class="k">
    <div><b>${list.length?diem:'-'} ${list.length?g(h):''}</b><span>Điểm ${KY==='ngay'?'ngày':KY==='tuan'?'tuần':'tháng'}</span></div>
    <div><b>${K.cl}</b><span>Chất lượng (60%)</span></div>
    <div><b>${K.kl}</b><span>Khối lượng (40%): ${(phut/60).toFixed(1)}/${DM.gio_ngay*nLV} giờ, ${K.dv}/${DM.don_vi_ngay*nLV} đơn vị việc</span></div>
    <div><b>${list.length}</b><span>Số việc (${xong} hoàn thành)${KY==='ngay'?'':', '+nLV+' ngày làm việc'}</span></div>
    <div><b style="font-size:16px;padding-top:6px">${['A','B','C','D'].map(x=>g(x)+' '+dem[x]).join(' ')}</b><span>Phân bố hạng</span></div>
  </div>
  ${cols.length?`<div class="chart">${cols.map(c=>`<div class="col" title="${esc(c.t)}">${c.h?c.v:''}<i class="g${c.h||'X'}" style="height:${c.h?c.v:0}%"></i>${c.lb}</div>`).join('')}</div>`:''}
  <div class="tbl"><table><thead><tr>${KY==='ngay'?'<th>#</th>':'<th>Ngày</th>'}<th>Dự án</th><th>Việc</th><th>Kết quả</th><th>Phút</th><th>Điểm</th><th>Hạng</th></tr></thead><tbody>
  ${list.map((i,n)=>`<tr><td>${KY==='ngay'?n+1:vn(i.ngay).slice(0,5)}</td><td>${esc(i.du_an)}</td><td>${esc(i.viec)}</td><td>${esc(i.ket_qua)}</td><td>${esc(i.thoi_gian_phut)}</td><td>${esc(i.diem)}</td><td>${g(i.hang)}</td></tr>`).join('')
   ||'<tr><td colspan="7" class="mu">Không có việc nào trong kỳ này</td></tr>'}
  </tbody></table></div>
  <div class="foot">Điểm kỳ = 60% Chất lượng + 40% Khối lượng. Chất lượng: trung bình điểm việc (hoàn thành 30, đúng hạn 20, ít sửa 20, độ khó và tác động 20, sản phẩm 10). Khối lượng: 50% giờ làm so định mức 8 giờ/ngày, 50% đơn vị việc so định mức 3/ngày (việc hoàn thành = độ khó/3). Hạng A ≥ 85, B ≥ 70, C ≥ 50, D &lt; 50. Xuất lúc ${new Date().toLocaleString('vi-VN')}</div>`;
}
function dich(n){const d=parse($('d').value);
  if(KY==='ngay')d.setDate(d.getDate()+n);else if(KY==='tuan')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n,1);
  $('d').value=iso(d);render()}
$('seg').onclick=e=>{const k=e.target.dataset.k;if(!k)return;KY=k;[...$('seg').children].forEach(b=>b.classList.toggle('on',b===e.target));render()};
$('prev').onclick=()=>dich(-1);$('next').onclick=()=>dich(1);$('d').onchange=render;
$('today').onclick=()=>{$('d').value=iso(new Date());render()};
$('go').onclick=load;
$('tab').onclick=e=>{const t=e.target.dataset.t;if(!t)return;TAB=t;[...$('tab').children].forEach(b=>b.classList.toggle('on',b===e.target));render()};

/* ===== Tab Phát triển cá nhân: Signal/Noise, Deep Work, Eisenhower, mục tiêu, Pareto ===== */
const MT={MT1:'Quản trị dự án và đối tác',MT2:'Digital Products',MT3:'Bắn cung, lái xe',MT4:'Chứng khoán',MT5:'Tiết kiệm, thu chi',MT6:'Học thuật, du học Phần Lan'};
const MUC_SIGNAL=60,MUC_SAU=40; // ngưỡng tham chiếu: >=60% thời gian signal, >=40% thời gian việc sâu
function renderCN(){
  const[s,e]=khoang(),a=iso(s),b=iso(e);
  const list=ITEMS.filter(i=>i.ngay>=a&&i.ngay<=b);
  const h=i=>(+i.thoi_gian_phut||30)/60, sum=l=>l.reduce((t,i)=>t+h(i),0);
  const tong=sum(list)||0, coNhan=list.filter(i=>i.signal);
  const sig=sum(list.filter(i=>i.signal==='signal')), noi=sum(list.filter(i=>i.signal==='noise'));
  const sau=sum(list.filter(i=>i.do_sau==='sau')), nong=sum(list.filter(i=>i.do_sau==='nong'));
  const pct=(x,y)=>y?Math.round(100*x/y):0;
  const pS=pct(sig,sig+noi),pD=pct(sau,sau+nong);
  const Q={Q1:0,Q2:0,Q3:0,Q4:0};list.forEach(i=>{if(Q[i.eisenhower]!==undefined)Q[i.eisenhower]+=h(i)});
  const gMT={};Object.keys(MT).forEach(k=>gMT[k]=0);
  list.forEach(i=>{const ms=String(i.muc_tieu||'').split(',').filter(m=>MT[m]);ms.forEach(m=>gMT[m]+=h(i)/ms.length)});
  const maxMT=Math.max(1,...Object.values(gMT));
  // Pareto: giá trị trên mỗi giờ = điểm x tác động / giờ
  const gt=i=>(+i.diem||0)*(+i.tac_dong||3)/100/h(i);
  const top=[...list].sort((x,y)=>gt(y)-gt(x)).slice(0,Math.max(1,Math.ceil(list.length*0.2)));
  const noiseTop=list.filter(i=>i.signal==='noise').sort((x,y)=>h(y)-h(x)).slice(0,3);
  const thieu=Object.keys(MT).filter(k=>gMT[k]===0);
  const goiY=[];
  if(coNhan.length<list.length)goiY.push(`${list.length-coNhan.length} việc chưa có nhãn phân tích (báo cáo cũ), chưa được tính vào tỷ lệ.`);
  if(pS&&pS<MUC_SIGNAL)goiY.push(`Thời gian signal ${pS}%, dưới mức tham chiếu ${MUC_SIGNAL}%.`);
  if(pD&&pD<MUC_SAU)goiY.push(`Việc sâu chỉ chiếm ${pD}% thời gian; nên giữ các khối 90 đến 120 phút không bị ngắt.`);
  noiseTop.forEach(i=>goiY.push(`Cân nhắc giao bớt, chuẩn hóa mẫu hoặc tự động hóa: "${esc(i.viec)}" (${h(i).toFixed(1)} giờ, noise).`));
  if(Q.Q3>Q.Q2)goiY.push(`Thời gian việc gấp nhưng ít quan trọng (Q3) đang nhiều hơn việc quan trọng không gấp (Q2).`);
  if(thieu.length)goiY.push(`Chưa có giờ nào cho: ${thieu.map(k=>MT[k]).join('; ')}.`);
  const tile=(v,l)=>`<div><b>${v}</b><span>${l}</span></div>`;
  $('card').innerHTML=`
  <h2>🔒 Phát triển cá nhân | ${tieuDe(s,e)}</h2><div class="sub">Chỉ mình bạn xem, không xuất cho lãnh đạo</div>
  <div class="k">${tile(pS+'%','Thời gian Signal ('+sig.toFixed(1)+'/'+(sig+noi).toFixed(1)+' giờ)')}
  ${tile(pD+'%','Việc sâu ('+sau.toFixed(1)+' giờ)')}${tile(Q.Q2.toFixed(1)+'h','Q2: quan trọng, không gấp')}${tile(tong.toFixed(1)+'h','Tổng giờ, '+list.length+' việc')}</div>
  <div class="k" style="grid-template-columns:1fr 1fr">
   <div><span>Ma trận Eisenhower (giờ)</span><table style="margin-top:6px"><tr><td></td><td class="mu">Gấp</td><td class="mu">Không gấp</td></tr>
    <tr><td class="mu">Quan trọng</td><td><b>Q1</b> ${Q.Q1.toFixed(1)}</td><td><b>Q2</b> ${Q.Q2.toFixed(1)}</td></tr>
    <tr><td class="mu">Ít quan trọng</td><td><b>Q3</b> ${Q.Q3.toFixed(1)}</td><td><b>Q4</b> ${Q.Q4.toFixed(1)}</td></tr></table></div>
   <div><span>Giờ theo mục tiêu</span>${Object.keys(MT).map(k=>`<div style="display:flex;gap:6px;align-items:center;font-size:12px;margin-top:4px"><span style="width:150px">${MT[k]}</span><i style="display:block;height:10px;border-radius:4px;background:var(--pri);width:${Math.round(120*gMT[k]/maxMT)}px"></i>${gMT[k].toFixed(1)}h</div>`).join('')}</div>
  </div>
  <div style="margin-bottom:14px"><b>Gợi ý</b><ul>${goiY.map(x=>'<li>'+x+'</li>').join('')||'<li class="mu">Chưa có gợi ý.</li>'}</ul></div>
  <div class="tbl"><b>Nhóm 20% việc giá trị cao nhất trên mỗi giờ (Pareto)</b><table><thead><tr><th>Ngày</th><th>Dự án</th><th>Việc</th><th>Giờ</th><th>Nhãn</th></tr></thead><tbody>
  ${top.map(i=>`<tr><td>${vn(i.ngay).slice(0,5)}</td><td>${esc(i.du_an)}</td><td>${esc(i.viec)}</td><td>${h(i).toFixed(1)}</td><td>${esc([i.signal,i.do_sau,i.eisenhower].filter(Boolean).join(' · '))}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Không có việc</td></tr>'}
  </tbody></table></div>
  <div class="tbl" style="margin-top:14px"><b>Toàn bộ việc trong kỳ</b><table><thead><tr><th>Ngày</th><th>Dự án</th><th>Việc</th><th>Giờ</th><th>Signal</th><th>Sâu</th><th>Ô</th><th>Mục tiêu</th><th>Lý do</th></tr></thead><tbody>
  ${list.sort((x,y)=>x.ngay.localeCompare(y.ngay)).map(i=>`<tr><td>${vn(i.ngay).slice(0,5)}</td><td>${esc(i.du_an)}${laRT(i)?' 🔒':''}</td><td>${esc(i.viec)}</td><td>${h(i).toFixed(1)}</td><td>${esc(i.signal)}</td><td>${esc(i.do_sau)}</td><td>${esc(i.eisenhower)}</td><td>${esc(i.muc_tieu)}</td><td class="mu">${esc(i.ly_do)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="foot">Signal/Noise (Steve Jobs), Deep Work (Cal Newport), ma trận Eisenhower, Pareto 80/20, nhật ký thời gian (Peter Drucker). Ngưỡng tham chiếu: signal ≥ ${MUC_SIGNAL}%, việc sâu ≥ ${MUC_SAU}%.</div>`;
}
$('png').onclick=async()=>{
  if(!window.html2canvas)return alert('Chưa tải được thư viện xuất ảnh, kiểm tra mạng.');
  const c=await html2canvas($('card'),{scale:2,backgroundColor:getComputedStyle($('card')).backgroundColor});
  const[s]=khoang(),a=document.createElement('a');
  a.download=`bao-cao-${KY}-${KY==='thang'?iso(s).slice(0,7):iso(s)}.png`;a.href=c.toDataURL('image/png');a.click();
};
$('send').onclick=async()=>{
  try{const body=JSON.parse($('paste').value);body.token=$('tok').value;
    const u=$('api').value.trim()+'?'+new URLSearchParams({action:'add',data:JSON.stringify(body)});
    const r=await (await fetch(u)).json();
    $('sst').textContent=r.ok?'Đã gửi '+r.saved.length+' việc: '+r.saved.map(s=>s.hang).join(', '):'Lỗi: '+(r.error||JSON.stringify(r.errors));
    if(r.ok){$('paste').value='';load()}
  }catch(e){$('sst').textContent='Lỗi: '+e.message}};
function setTheme(t){document.documentElement.dataset.theme=t;$('theme').textContent=t==='dark'?'☀️ Sáng':'🌙 Tối';ls.set('theme',t)}
setTheme(ls.get('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
render();if($('api').value)load();
</script></body></html>
